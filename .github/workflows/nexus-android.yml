name: Android build check

on:
  push:
    branches: [nexus-android-mvp]
    paths:
      - "NEXUS/**"
      - ".github/workflows/nexus-android.yml"
  pull_request:
    paths:
      - "NEXUS/**"
      - ".github/workflows/nexus-android.yml"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble debug APK
        run: gradle --no-daemon -p NEXUS :app:assembleDebug
